<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METRO 3D SEOUL - 수도권 지하철 실시간 3D 디지털 트윈</title>
    <meta name="description" content="수도권 지하철 열차 운행을 3D 지도 위에서 시뮬레이션하는 디지털 트윈" />
    <meta name="theme-color" content="#090d16" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f172a'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%2310b981' stroke-width='6'/%3E%3Cpath d='M22 32h20M32 22v20' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Pretendard:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D Map Viewport -->
      <div id="map"></div>

      <!-- Top Header Navigation -->
      <header id="header" class="glass-panel">
        <div class="header-left">
          <div class="logo-badge">
            <span class="logo-pulse"></span>
            <span class="logo-text">METRO 3D</span>
            <span class="logo-sub">SEOUL</span>
          </div>
          <div class="status-chip live">
            <span class="dot"></span>
            <span class="status-label">SIMULATION LIVE</span>
          </div>
        </div>

        <div class="header-center">
          <div id="clock" class="digital-clock">
            <span id="clock-time">--:--:--</span>
            <span id="clock-date" class="date-sub">KST</span>
          </div>
          <div class="stat-counter">
            <span class="stat-item"><strong id="stat-active-trains">0</strong> 열차 주행중</span>
            <span class="stat-sep">•</span>
            <span class="stat-item"><strong id="stat-stations">634</strong> 역</span>
            <span class="stat-sep">•</span>
            <span class="stat-item"><strong id="stat-lines">24</strong> 노선</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Search Bar -->
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="station-search" placeholder="지하철역 검색 (예: 강남, 서울역)" autocomplete="off" />
            <div id="search-results" class="search-dropdown hidden"></div>
          </div>

          <button id="btn-sound" class="icon-btn" title="사운드 앰비언스 켜기/끄기">
            <svg id="sound-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <svg id="sound-icon-on" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <a class="icon-btn" href="https://github.com/jeiel85/metro3d-antigravity" target="_blank" rel="noopener noreferrer" title="GitHub 저장소" aria-label="GitHub 저장소 (새 탭에서 열림)">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
        </div>
      </header>

      <!-- Floating Toolbars -->
      <aside class="right-toolbar">
        <div class="tool-group glass-panel">
          <button id="btn-theme" class="tool-btn" title="테마 변경 (다크 / 라이트)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button id="btn-3d-toggle" class="tool-btn active" title="3D 틸트 토글">
            <span class="tool-text">3D</span>
          </button>
          <button id="btn-reset-view" class="tool-btn" title="서울 전역 조망">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button id="btn-chill-mode" class="tool-btn" title="지하철 멍때리기 (랜덤 열차 자동 팔로우)">
            <span class="chill-icon">☕</span>
          </button>
        </div>

        <!-- Speed Selector -->
        <div class="speed-group glass-panel">
          <button class="speed-btn active" data-speed="1">1x</button>
          <button class="speed-btn" data-speed="2">2x</button>
          <button class="speed-btn" data-speed="5">5x</button>
          <button class="speed-btn" data-speed="10">10x</button>
        </div>
      </aside>

      <!-- Left Lines Drawer -->
      <aside id="line-drawer" class="left-drawer glass-panel">
        <div class="drawer-header">
          <h3>노선 필터 (<span id="active-line-count">24</span>)</h3>
          <div class="drawer-actions">
            <button id="btn-select-all-lines" class="text-btn">전체</button>
            <button id="btn-clear-lines" class="text-btn">해제</button>
          </div>
        </div>
        <div id="lines-list" class="lines-scroll-list"></div>
      </aside>

      <!-- Train Follow HUD (Active when tracking a train) -->
      <div id="tracking-hud" class="tracking-banner glass-panel hidden">
        <div class="tracking-info">
          <div class="train-badge" id="hud-line-badge">2호선</div>
          <div class="train-meta">
            <div class="train-title">
              <span id="hud-train-name">열차 #2045</span>
              <span class="train-destination" id="hud-train-dest">성수행</span>
            </div>
            <div class="train-route-info">
              <span class="route-station prev" id="hud-prev-station">강남</span>
              <span class="route-arrow">➔</span>
              <span class="route-station next" id="hud-next-station">역삼</span>
              <span class="route-dist" id="hud-remain-dist">450m 남음</span>
            </div>
          </div>
          <div class="train-speedometer">
            <span class="speed-val" id="hud-speed-val">68</span>
            <span class="speed-unit">km/h</span>
          </div>
        </div>
        <button id="btn-stop-tracking" class="close-track-btn" title="추적 모드 해제">✕</button>
      </div>

      <!-- Station Detail Card (Clicking a station) -->
      <div id="station-card" class="station-card glass-panel hidden">
        <button id="btn-close-station" class="card-close">✕</button>
        <div class="card-header">
          <h2 id="card-station-name">강남역</h2>
          <span id="card-station-en" class="station-en">Gangnam</span>
          <div id="card-station-lines" class="station-lines-chips"></div>
        </div>
        <div class="card-body">
          <div class="arrivals-section">
            <div class="section-title">열차 도착 예정</div>
            <div id="card-arrivals-list" class="arrivals-list">
              <div class="arrival-item loading">도착 정보를 불러오는 중...</div>
            </div>
          </div>
          <div class="congestion-section" id="card-congestion-box">
            <div class="section-title">혼잡도 & 승하차 정보</div>
            <div class="congestion-bar-wrapper">
              <div class="congestion-label">
                <span>현재 시간대 혼잡도</span>
                <span id="card-congestion-text" class="congestion-val">보통 (62%)</span>
              </div>
              <div class="congestion-track">
                <div id="card-congestion-bar" class="congestion-fill" style="width: 62%;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Initial Loading Screen -->
      <div id="loader" class="loader-overlay">
        <div class="loader-content">
          <div class="loader-train">
            <div class="train-car"></div>
            <div class="train-track-anim"></div>
          </div>
          <h1 class="loader-title">METRO 3D SEOUL</h1>
          <p class="loader-subtitle">수도권 전철 634개 역과 3D 도시를 구축하는 중...</p>
          <div class="loader-progress-bar">
            <div id="loader-progress" class="loader-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
